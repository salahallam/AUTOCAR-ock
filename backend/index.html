<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Ahmed Car Rent</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">AHMED CAR RENT</span><h1>Administration</h1></div><button id="logout" class="secondary hidden">Déconnexion</button></header>
<section id="login" class="panel login"><h2>Connexion</h2><form id="loginForm"><label>E-mail<input id="loginEmail" type="email" required autocomplete="username"></label><label>Mot de passe<input id="loginPassword" type="password" required autocomplete="current-password"></label><button>Se connecter</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" class="hidden"><div class="stats"><article class="panel"><span>En attente</span><strong id="pendingCount">0</strong></article><article class="panel"><span>Confirmées</span><strong id="confirmedCount">0</strong></article><article class="panel"><span>Total demandes</span><strong id="totalCount">0</strong></article></div>
<section class="panel"><div class="sectionHead"><h2>Réservations</h2><button id="refresh" class="secondary">Actualiser</button></div><div class="tableWrap"><table><thead><tr><th>Référence / Client</th><th>Voiture</th><th>Dates</th><th>Total</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="bookingsBody"></tbody></table></div><p id="dashboardError" class="error"></p></section>
<section class="panel"><h2>Véhicules et tarifs</h2><div id="vehiclesList" class="vehicles"></div></section></section></main><script src="admin.js"></script></body></html>
